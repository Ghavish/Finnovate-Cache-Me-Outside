<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070B10" />
    <meta name="description" content="MoBudget: smart money planning in English, French and Kreol Morisien." />
    <title>MoBudget</title>
    <script>
      // Set the theme before the page paints, so there is no light flash in dark mode.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('mobudget-theme') } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
